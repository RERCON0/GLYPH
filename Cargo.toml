[package]
name = "glyph"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "GLYPH — локальный генератор паролей, токенов и ключей"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
preview = []

[[example]]
name = "snapshot"
required-features = ["preview"]

[dependencies]
base64 = "0.22"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.release.package.epaint]
opt-level = 2

[profile.release.package.egui]
opt-level = 2
